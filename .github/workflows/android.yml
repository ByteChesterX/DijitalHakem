name: Build Android Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versiyon Adı (örn: 1.0.0)"
        required: true
        default: "1.0.0"

      version_code:
        description: "Versiyon Kodu (örn: 1)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kodu
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Gradle Önbelleği Yapılandırması
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true
          gradle-home-cache-cleanup: true

      - name: Gradlew'yi Çalıştırılabilir Yap
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ./app/release-keystore.jks

      - name: Release APK Oluştur
        run: ./gradlew assembleRelease
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ORG_GRADLE_PROJECT_versionName: ${{ github.event.inputs.version_name }}
          ORG_GRADLE_PROJECT_versionCode: ${{ github.event.inputs.version_code }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: APK Dosyasını Bul
        id: find_apk
        run: |
          apk_path=$(find ./app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
          echo "Bulunan APK: $apk_path"

      - name: GitHub Release Oluştur ve APK Yükle
        if: ${{ steps.find_apk.outputs.apk_path != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: DijitalHakem v${{ github.event.inputs.version_name }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
